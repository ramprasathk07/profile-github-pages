<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark" subtitle="Typographic monogram — mono prompt + serif name" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 0; display: flex; align-items: center; justify-content: center; height: 150px; gap: 40px; }
  .mark { display: flex; align-items: baseline; gap: 10px; }
  .prompt { font-family: var(--font-mono); font-size: 20px; color: var(--clay); font-weight: 500; }
  .name { font-family: var(--font-serif); font-size: 30px; font-weight: 300; letter-spacing: -0.01em; color: var(--ink); }
  .name b { font-weight: 600; }
  .inv { background: var(--ink); padding: 18px 26px; border-radius: 8px; }
  .inv .name { color: var(--paper); } .inv .prompt { color: #E08A6C; }
</style>
</head>
<body>
  <div class="mark"><span class="prompt">~/</span><span class="name">ram <b>prasath</b></span></div>
  <div class="inv mark"><span class="prompt">~/</span><span class="name">ram <b>prasath</b></span></div>
</body>
</html>
