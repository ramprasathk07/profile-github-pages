<!-- @dsCard group="Type" viewport="700x150" name="Type Scale" subtitle="11 → 84px modular scale, serif at the top end" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 18px 28px; display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; }
  span { font-family: var(--font-serif); color: var(--ink); font-weight: 300; line-height: 1; }
  .s1 { font-size: 14px; } .s2 { font-size: 18px; } .s3 { font-size: 26px; }
  .s4 { font-size: 33px; } .s5 { font-size: 42px; } .s6 { font-size: 54px; } .s7 { font-size: 68px; }
  small { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); display:block; }
</style>
</head>
<body>
  <span class="s1">Aa<small>14</small></span>
  <span class="s2">Aa<small>18</small></span>
  <span class="s3">Aa<small>26</small></span>
  <span class="s4">Aa<small>33</small></span>
  <span class="s5">Aa<small>42</small></span>
  <span class="s6">Aa<small>54</small></span>
  <span class="s7">Aa<small>68</small></span>
</body>
</html>
