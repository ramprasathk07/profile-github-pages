<!-- @dsCard group="Colors" viewport="700x150" name="Paper & Ink" subtitle="Warm paper surfaces and the ink text ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 20px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--hairline); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--ink); margin-top: 8px; letter-spacing: .02em; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FBF9F4"></div><div class="name">paper</div><div class="hex">#FBF9F4</div></div>
    <div class="sw"><div class="chip" style="background:#F4F0E8"></div><div class="name">paper-raised</div><div class="hex">#F4F0E8</div></div>
    <div class="sw"><div class="chip" style="background:#EDE8DD"></div><div class="name">paper-sunken</div><div class="hex">#EDE8DD</div></div>
    <div class="sw"><div class="chip" style="background:#908B7E"></div><div class="name">ink-faint</div><div class="hex">#908B7E</div></div>
    <div class="sw"><div class="chip" style="background:#56524A"></div><div class="name">ink-muted</div><div class="hex">#56524A</div></div>
    <div class="sw"><div class="chip" style="background:#1B1A16"></div><div class="name">ink</div><div class="hex">#1B1A16</div></div>
  </div>
</body>
</html>
