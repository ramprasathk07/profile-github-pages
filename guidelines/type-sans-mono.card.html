<!-- @dsCard group="Type" viewport="700x170" name="Sans & Mono" subtitle="Hanken Grotesk UI · JetBrains Mono labels & code" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 22px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .lab { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 12px; }
  .sans-1 { font-family: var(--font-sans); font-size: 15px; font-weight: 600; color: var(--ink); }
  .sans-2 { font-family: var(--font-sans); font-size: 14px; font-weight: 400; color: var(--ink-muted); margin-top: 4px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--clay); }
  .code { font-family: var(--font-mono); font-size: 13px; color: var(--ink); background: var(--paper-raised); border: 1px solid var(--hairline); border-radius: 5px; padding: 8px 10px; margin-top: 10px; }
</style>
</head>
<body>
  <div>
    <div class="lab">Hanken Grotesk — UI</div>
    <div class="sans-1">Projects · Experience · Stack</div>
    <div class="sans-2">Navigation, captions, buttons, meta.</div>
  </div>
  <div>
    <div class="lab">JetBrains Mono — code</div>
    <div class="eyebrow">// 01 — about</div>
    <div class="code">vllm.serve(model, quant="w4a16")</div>
  </div>
</body>
</html>
