<!-- @dsCard group="Colors" viewport="700x150" name="Signal & Status" subtitle="Terracotta accent, cobalt, and muted status hues" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 20px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--hairline); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--ink); margin-top: 8px; letter-spacing: .02em; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#BB4A2C"></div><div class="name">clay</div><div class="hex">#BB4A2C</div></div>
    <div class="sw"><div class="chip" style="background:#F5E7DF"></div><div class="name">clay-wash</div><div class="hex">#F5E7DF</div></div>
    <div class="sw"><div class="chip" style="background:#2A4B8D"></div><div class="name">cobalt</div><div class="hex">#2A4B8D</div></div>
    <div class="sw"><div class="chip" style="background:#4A7A52"></div><div class="name">positive</div><div class="hex">#4A7A52</div></div>
    <div class="sw"><div class="chip" style="background:#B07A1E"></div><div class="name">warning</div><div class="hex">#B07A1E</div></div>
  </div>
</body>
</html>
