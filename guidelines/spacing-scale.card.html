<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base · 4 → 128px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 22px 28px; display: flex; align-items: flex-end; gap: 16px; }
  .col { text-align: center; }
  .bar { background: var(--clay); width: 100%; border-radius: 2px; }
  .box { display: flex; align-items: flex-end; height: 80px; }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); margin-top: 8px; }
</style>
</head>
<body>
  <div class="col"><div class="box"><div class="bar" style="width:4px;height:4px"></div></div><div class="lab">1·4</div></div>
  <div class="col"><div class="box"><div class="bar" style="width:8px;height:8px"></div></div><div class="lab">2·8</div></div>
  <div class="col"><div class="box"><div class="bar" style="width:16px;height:16px"></div></div><div class="lab">4·16</div></div>
  <div class="col"><div class="box"><div class="bar" style="width:24px;height:24px"></div></div><div class="lab">6·24</div></div>
  <div class="col"><div class="box"><div class="bar" style="width:32px;height:32px"></div></div><div class="lab">8·32</div></div>
  <div class="col"><div class="box"><div class="bar" style="width:48px;height:48px"></div></div><div class="lab">12·48</div></div>
  <div class="col"><div class="box"><div class="bar" style="width:64px;height:64px"></div></div><div class="lab">16·64</div></div>
  <div class="col"><div class="box"><div class="bar" style="width:80px;height:80px"></div></div><div class="lab">20·80</div></div>
</body>
</html>
