<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); }
  #root { min-height: 100vh; }
  .lucide-host svg { width: 100%; height: 100%; display: block; stroke: currentColor; }
  @keyframes blink { 50% { opacity: 0; } }

  /* blog prose (Thinking-Machines style reading column) */
  .post-body { font-family: var(--font-serif); font-size: 19px; line-height: 1.78; color: var(--ink); }
  .post-body p { margin: 0 0 1.15em; }
  .post-body b { font-weight: 600; }
  .post-body i { font-style: italic; }
  .post-body a { color: var(--clay); border-bottom: 1px solid var(--clay-wash); }
  .post-body a:hover { border-bottom-color: var(--clay); }
  .post-body h2 {
    font-family: var(--font-serif); font-weight: 400; font-size: 27px;
    letter-spacing: -0.015em; line-height: 1.2; color: var(--ink);
    margin: 2em 0 0.6em;
  }

  /* responsive */
  @media (max-width: 860px) {
    .hero-grid { grid-template-columns: 1fr !important; gap: 36px !important; }
    .re-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
    .month-row { grid-template-columns: 1fr !important; gap: 10px !important; }
    .nav-status { display: none; }
  }
  @media (max-width: 640px) {
    .nav-tabs { display: none !important; }
  }
</style>
